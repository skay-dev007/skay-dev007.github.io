{% assign awards = site.data.data.awards %}
{% if awards %}
<section class="section awards-section">

  <h2 class="section-title">
    <span class="fa-stack fa-xs">
      <i class="fas fa-circle fa-stack-2x"></i>
      <i class="fas fa-trophy fa-stack-1x fa-inverse"></i>
    </span>
    {{ awards.title }}
  </h2>

  {% for award in awards.list %}
  <div class="item">
    <div class="meta">
      <div class="upper-row">
        <h3 class="job-title">{{ award.name }}</h3>
        <div class="time">{{ award.time }}</div>
      </div><!--//upper-row-->
    </div><!--//meta-->
  </div><!--//item-->
  {% endfor %}

</section><!--//section-->
{% endif %}
